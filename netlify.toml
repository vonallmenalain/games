# Die Site sind die Dateien im Wurzelverzeichnis; gebaut wird nichts.
# Veröffentlicht wird trotzdem dist/: netlify/build.mjs kopiert dorthin, was
# der Browser braucht, und lässt die Werkzeuge und die Doku weg.
#
# Keine Umgebungsvariablen, keine Geheimnisse. Die Bestenliste läuft direkt
# aus dem Browser nach Firestore; geschützt wird sie von den Regeln des
# Firebase-Projekts, nicht von einem Server hier.
#
# Eine einzige Edge Function, und sie braucht keine Zeile hier – Netlify
# findet sie in netlify/edge-functions/: turnier-vorschau.js schreibt den
# Namen eines Turniers in die Vorschau seines Links (WhatsApp & Co.) und
# leitet einen eigenen Turnierlink (/hotdog) weiter. Sie liest nur, was
# jeder lesen darf.
#
# Auch keine Weiterleitungen: /turmbau findet Netlify von selbst zu
# turmbau.html, / zu index.html. Was es nicht gibt, beantwortet 404.html.

[build]
  publish = "dist"
  command = "node netlify/build.mjs"

[build.environment]
  NODE_VERSION = "22"
  # Netlify sucht nach dem Bauen in allen Dateien nach Geheimnissen und bricht
  # ab, wenn es eines zu finden glaubt. Der Web-API-Schlüssel von Firebase in
  # cloud.js sieht für den Scanner so aus – er ist aber kein Geheimnis: Er
  # steht in jeder Seite, die Firebase im Browser nutzt, und die
  # Firestore-Regeln schützen die Daten, nicht dieser Schlüssel.
  #
  # Das ist der Schlüssel aus cloud.js, und er muss derselbe sein:
  # scripts/pruefen.mjs hält die beiden zusammen. Hier stand eine Weile der
  # des alten Projekts – ein Wert, den es in diesen Dateien gar nicht mehr
  # gab, während der, der drinsteht, nicht freigegeben war.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDtuKd2P0JL_We6JBmj25vHN1hEHR-Xx84"
