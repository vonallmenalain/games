<!doctype html>
<!--
  Erzeugt von scripts/seiten-bauen.mjs – nicht von Hand ändern.

  Die Turnierseite: /turnier?t=<id>. Welches Turnier gemeint ist, steht in der
  Adresse; was darauf steht, baut turnier.js – wie lange es noch läuft, die
  Spiele mit ihrer Rangliste, die Gesamtwertung, die Regeln und der Link zum
  Weitergeben. Sie gehört zur installierten App: Wer im Turnier spielt, kommt
  von jedem Spiel hierher zurück, auch ohne Netz.

  Nicht für Suchmaschinen: Ein Turnier "nur mit Link" soll auch dort nicht
  auftauchen.
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Mini-Games" />
    <meta name="description" content="Ein Turnier der Mini-Games: dieselben Spiele, eine eigene Rangliste, ein Ende. Ohne Konto, ohne Anmeldung." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mini-Games" />
    <meta name="theme-color" content="#a8ddf0" />
    <title>Turnier · Mini-Games</title>
    <link rel="stylesheet" href="styles.css?v=2026-09-27-01" />
    <link rel="manifest" href="app.webmanifest?v=2026-09-27-01" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body data-page="turnier">
    <main class="mini-seite" data-turnier>
      <p class="mini-hinweis">Das Turnier wird geladen...</p>
    </main>

    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
    <script defer src="highscore.js?v=2026-09-27-01"></script>
    <script defer src="cloud.js?v=2026-09-27-01"></script>
    <script defer src="mini-games.js?v=2026-09-27-01"></script>
    <script defer src="turnier.js?v=2026-09-27-01"></script>
    <script defer src="pwa.js?v=2026-09-27-01"></script>
  </body>
</html>
